<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal and Social Justice Platform</title>
  <style>
    /* Styles for your website */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    header {
      background-color: #004080;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    main {
      padding: 2rem;
    }
    section {
      background: white;
      margin-bottom: 1rem;
      padding: 1rem;
      border-radius: 5px;
    }
    footer {
      background-color: #004080;
      color: white;
      text-align: center;
      padding: 1rem;
      position: fixed;
      width: 100%;
      bottom: 0;
    }
    .button {
      display: inline-block;
      background-color: #007BFF;
      color: white;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
    }
    .button:hover {
      background-color: #0056b3;
    }
    #login-form, #inquiry-form, #user-info {
      display: none;
    }
  </style>
  <!-- Add Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore.js"></script>
</head>
<body>
  <header>
    <h1>Legal and Social Justice Platform</h1>
  </header>

  <main>
    <section id="login-section">
      <h2>Login or Sign Up</h2>
      <button id="login-btn" class="button">Login</button>
      <button id="signup-btn" class="button">Sign Up</button>
    </section>

    <section id="login-form">
      <h2>Login</h2>
      <input type="email" id="email" placeholder="Email" required><br>
      <input type="password" id="password" placeholder="Password" required><br>
      <button id="submit-login" class="button">Login</button>
      <p id="error-message" style="color: red;"></p>
    </section>

    <section id="user-info">
      <h2>Welcome, <span id="user-name"></span></h2>
      <button id="logout-btn" class="button">Logout</button>
    </section>

    <section id="inquiry-form">
      <h2>Submit Your Legal Inquiry</h2>
      <textarea id="inquiry-description" placeholder="Describe your legal issue..."></textarea><br>
      <button id="submit-inquiry" class="button">Submit Inquiry</button>
    </section>

  </main>

  <footer>
    <p>&copy; 2025 Legal and Social Justice Platform. All rights reserved.</p>
  </footer>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Elements
    const loginBtn = document.getElementById('login-btn');
    const signupBtn = document.getElementById('signup-btn');
    const loginForm = document.getElementById('login-form');
    const userInfo = document.getElementById('user-info');
    const userName = document.getElementById('user-name');
    const logoutBtn = document.getElementById('logout-btn');
    const submitLogin = document.getElementById('submit-login');
    const errorMessage = document.getElementById('error-message');
    const submitInquiryBtn = document.getElementById('submit-inquiry');
    const inquiryForm = document.getElementById('inquiry-form');

    // Login/Sign up
    loginBtn.onclick = () => loginForm.style.display = 'block';
    signupBtn.onclick = () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.createUserWithEmailAndPassword(email, password)
        .then(() => {
          alert('Account Created');
          loginForm.style.display = 'none';
        })
        .catch((error) => {
          errorMessage.textContent = error.message;
        });
    };

    submitLogin.onclick = () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          userInfo.style.display = 'block';
          userName.textContent = userCredential.user.email;
          loginForm.style.display = 'none';
          inquiryForm.style.display = 'block';
        })
        .catch((error) => {
          errorMessage.textContent = error.message;
        });
    };

    // Logout
    logoutBtn.onclick = () => {
      auth.signOut().then(() => {
        userInfo.style.display = 'none';
        loginForm.style.display = 'none';
        inquiryForm.style.display = 'none';
      });
    };

    // Submit inquiry
    submitInquiryBtn.onclick = () => {
      const inquiry = document.getElementById('inquiry-description').value;
      const user = firebase.auth().currentUser;
      if (inquiry) {
        db.collection("inquiries").add({
          user_id: user.uid,
          inquiry_description: inquiry,
          status: "submitted",
          lawyer_response: null, // Lawyer will respond
          escalation: false // Not escalated yet
        }).then(() => {
          alert("Your inquiry has been submitted.");
        }).catch((error) => {
          alert("Error submitting inquiry: " + error.message);
        });
      }
    };
  </script>
</body>
</html>
